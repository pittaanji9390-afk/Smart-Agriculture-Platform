[metadata]
name = agrisphere-os
version = 2.5.0
description = Enterprise Precision Agriculture & IoT Farm Intelligence Platform
author = AgriSphere Open Source Initiative
author_email = info@agrisphere.io
license = MIT
url = https://github.com/pittaanji9390-afk/Smart-Agriculture-Platform

[flake8]
max-line-length = 120
extend-ignore = E203, E501, E741, F401, F841, W503
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    frontend,
    mobile_app,
    tools,
    build,
    dist

[coverage:run]
source = backend, services, edge_gateway
omit =
    tests/*
    tools/*
    frontend/*
    mobile_app/*
    .pytest_cache/*
    run_server.py

[coverage:report]
precision = 2
show_missing = True
