[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrisphere-os"
version = "2.5.0"
description = "Enterprise Precision Agriculture & IoT Farm Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AgriSphere Open Source Initiative", email = "info@agrisphere.io" }
]
keywords = ["agriculture", "iot", "smart-farming", "irrigation", "remote-sensing", "ndvi", "mandi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Agricultural Science",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "aiofiles>=23.2.1",
    "requests>=2.31.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "types-requests>=2.31.0",
    "types-aiofiles>=23.2.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
lint = [
    "ruff>=0.3.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
]
security = [
    "pip-audit>=2.7.0",
    "safety>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/pittaanji9390-afk/Smart-Agriculture-Platform"
Documentation = "https://github.com/pittaanji9390-afk/Smart-Agriculture-Platform#readme"
Repository = "https://github.com/pittaanji9390-afk/Smart-Agriculture-Platform.git"
Issues = "https://github.com/pittaanji9390-afk/Smart-Agriculture-Platform/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "services*", "edge_gateway*"]
exclude = ["tests*", "tools*", "frontend*", "mobile_app*"]

# -----------------------------------------------------------------------------
# Pytest & Coverage Configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::sqlalchemy.exc.MovedIn20Warning",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "tests/*",
    "tools/*",
    "*/__pycache__/*",
    "frontend/*",
    "mobile_app/*",
    ".pytest_cache/*",
    "run_server.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# -----------------------------------------------------------------------------
# Ruff Linter & Formatter Configuration
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "frontend",
    "mobile_app",
    "tools",
    "*.db"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "F401", "F841"]

# -----------------------------------------------------------------------------
# Black Formatter Configuration
# -----------------------------------------------------------------------------
[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | frontend
  | mobile_app
  | tools
)/
'''

# -----------------------------------------------------------------------------
# Mypy Static Type Checker Configuration
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["tests/", "tools/", "frontend/", "mobile_app/"]
